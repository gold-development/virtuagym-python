[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "virtuagym"
version = "1.0.1"
description = "Typed Python client for the Virtuagym API (v1 + v3), sync + async"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Gold Development", email = "admin@gold-development.nl" }]
keywords = ["virtuagym", "api", "client", "fitness"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/gold-development/virtuagym-python"
Issues = "https://github.com/gold-development/virtuagym-python/issues"

[project.optional-dependencies]
dev = [
    "mypy>=1.14",
    "pytest>=8",
    "pytest-asyncio>=0.25",
    # Retry transient network flakes in the live smoke tests (pytest --reruns).
    "pytest-rerunfailures>=14",
    "python-dotenv>=1",
    "respx>=0.22",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["virtuagym"]

[tool.pytest.ini_options]
# Smoke tests hit the live API; run them explicitly with `pytest -m smoke`.
addopts = "-m 'not smoke'"
markers = ["smoke: tests against the live Virtuagym API (need .env credentials)"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["virtuagym"]
