name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      # Required for PyPI trusted publishing (OIDC).
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -e .[dev] build
      - run: ruff check .
      - run: mypy
      # Unit tests only — smoke tests need live credentials and are run locally.
      - run: pytest
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
